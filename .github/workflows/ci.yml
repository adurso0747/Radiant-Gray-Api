name: CI

# Runs on every push and every pull request against main — pytest has
# to pass. This doesn't deploy anything: Render has its own build/
# deploy pipeline watching this same repo. This workflow exists purely
# so a broken commit gets flagged (as a red X on the commit/PR) before
# it ever reaches Render.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: pytest
