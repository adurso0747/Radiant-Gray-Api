services:
  - type: web
    name: radiant-gray-api
    runtime: python
    plan: free
    # Pre-Deploy Command isn't available on Render's free tier, so the
    # migration runs as part of the build instead — same effect (runs
    # once per deploy, before the app starts).
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT
        value: 5/hour
